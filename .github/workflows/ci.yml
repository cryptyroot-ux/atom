on:
  push:
    branches: [master, atom-v4.1-migration-hardening]
  pull_request:

jobs:
  verify:
    name: Build / Test / Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (edition 2022)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format (check)
        run: cargo fmt --all -- --check

      - name: Build
        run: cargo build --workspace --verbose

      - name: Test
        run: cargo test --workspace --verbose

      - name: Clippy (strict, zero warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Secret scan (fail on match)
        run: bash tools/secret_scan.sh .

  spec-gate:
    name: Spec G0 (repository, fail-closed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pyyaml
        run: pip install pyyaml

      - name: Validate release (G0)
        run: python tools/validate_release.py --root . --emit evidence/g0/gate-result.json

      - name: Upload G0 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g0-gate-result
          path: evidence/g0/gate-result.json
