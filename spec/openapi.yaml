openapi: 3.1.0
info:
  title: ATOM Sovereign Agent Runtime API
  description: |
    ATOM.0-alpha — Sovereign Recursive Agent Architecture.
    
    This API exposes the runtime surface for mission control, effect dispatch,
    capability management, and evidence retrieval. All mutation paths traverse
    the sovereign kernel boundary (authorize → commit).
    
    ## Authentication

    Every route except `GET /health` and `GET /ready` requires
    `Authorization: Bearer <token>`. The token is a provisioned operator
    secret (opaque, minimum 16 bytes), not a JWT: it proves the caller may
    talk to the daemon, never *who* they are. Missing or wrong credentials
    yield `401` with a `WWW-Authenticate: Bearer realm="atom"` challenge.
    The daemon refuses to start without a token unless `--no-auth` is passed
    explicitly (loopback development only). Auth is transport only — it never
    substitutes for capability grants or approvals.
    
    ## Idempotency
    All mutation endpoints accept `Idempotency-Key` header.
    Duplicate requests with the same key return the original response.
    
    ## Error Format
    Errors follow RFC 9457 (Problem Details):
    ```json
    {
      "type": "https://atom.dev/errors/kernel-denied",
      "title": "Kernel Authorization Denied",
      "status": 403,
      "detail": "Capability grant does not cover requested operation",
      "instance": "/missions/abc123/effects/def456"
    }
    ```
  version: 4.0.0-alpha
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  contact:
    name: Crypty Root
    url: https://github.com/cryptyroot-ux/atom

servers:
  - url: http://localhost:8420
    description: Local development
  - url: https://api.atom.dev
    description: Production (future)

tags:
  - name: missions
    description: Mission lifecycle management
  - name: effects
    description: Effect intent dispatch and reconciliation
  - name: capabilities
    description: Capability grant management
  - name: evidence
    description: Evidence and observation retrieval
  - name: ledger
    description: Tamper-evident event store
  - name: secrets
    description: Brokered secret handle management
  - name: health
    description: System health and readiness
  - name: provider
    description: Bounded conversational model gateway

paths:
  /health:
    get:
      tags: [health]
      summary: Health check
      operationId: getHealth
      responses:
        '200':
          description: System healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [healthy, degraded, unhealthy]
                  version:
                    type: string
                    example: "4.0.0-alpha"
                  uptime_seconds:
                    type: integer
                  crates_loaded:
                    type: integer
                    example: 26

  /ready:
    get:
      tags: [health]
      summary: Readiness check
      operationId: getReady
      responses:
        '200':
          description: System ready to accept missions
        '503':
          description: System not ready

  /chat:
    post:
      tags: [provider]
      summary: Send a conversational message to the configured model
      operationId: chat
      description: |
        Proxies a bounded conversation to the configured OpenAI-compatible
        provider. Provider output is advisory and cannot grant capabilities or
        dispatch effects. Returns 503 when no provider is configured.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: Assistant response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
        '400':
          description: Invalid conversation
        '503':
          description: Provider is not configured or unavailable

  /missions:
    get:
      tags: [missions]
      summary: List missions
      operationId: listMissions
      parameters:
        - name: state
          in: query
          schema:
            type: string
            enum: [CREATED, RUNNING, SUCCEEDED, FAILED, CANCELLED, BLOCKED]
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Mission list
          content:
            application/json:
              schema:
                type: object
                properties:
                  missions:
                    type: array
                    items:
                      $ref: '#/components/schemas/Mission'
                  total:
                    type: integer

    post:
      tags: [missions]
      summary: Create mission
      operationId: createMission
      description: |
        Creates a complete durable mission contract. The mission enters CREATED
        state and must be authorized by the kernel before any effects can be
        dispatched. A goal alone is not accepted: success criteria,
        constraints, budgets, authority profile, evidence requirements, and
        stopping rules must all be declared.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MissionCreate'
      responses:
        '201':
          description: Mission created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mission'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/KernelDenied'

  /missions/{mission_id}:
    get:
      tags: [missions]
      summary: Get mission
      operationId: getMission
      parameters:
        - $ref: '#/components/parameters/MissionId'
      responses:
        '200':
          description: Mission details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mission'
        '404':
          $ref: '#/components/responses/NotFound'

  /missions/{mission_id}/cancel:
    post:
      tags: [missions]
      summary: Cancel mission
      operationId: cancelMission
      description: |
        Requests cancellation. Mission enters CANCELLED only when all owned
        consequential effects are reconciled (INV-013).
      parameters:
        - $ref: '#/components/parameters/MissionId'
      responses:
        '200':
          description: Cancellation requested
        '409':
          description: Mission has unreconciled effects

  /effects:
    post:
      tags: [effects]
      summary: Dispatch effect intent
      operationId: dispatchEffect
      description: |
        Dispatches an effect intent. Requires valid CommitPermit bound to
        the exact effect digest, principal, grant generation, and resource
        witness (EFX-004).
        
        Ambiguous outcomes enter UNKNOWN_OUTCOME and block dependent
        mutations until reconciled (EFX-003).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EffectIntent'
      responses:
        '201':
          description: Effect dispatched
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EffectResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/KernelDenied'
        '409':
          description: Effect already dispatched (idempotency hit)

  /effects/{effect_id}:
    get:
      tags: [effects]
      summary: Get effect status
      operationId: getEffect
      parameters:
        - name: effect_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Effect details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EffectResult'
        '404':
          $ref: '#/components/responses/NotFound'

  /capabilities:
    get:
      tags: [capabilities]
      summary: List capability grants
      operationId: listCapabilities
      parameters:
        - name: subject_id
          in: query
          schema:
            type: string
        - name: active_only
          in: query
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: Capability grant list
          content:
            application/json:
              schema:
                type: object
                properties:
                  grants:
                    type: array
                    items:
                      $ref: '#/components/schemas/CapabilityGrant'

  /evidence:
    get:
      tags: [evidence]
      summary: List evidence observations
      operationId: listEvidence
      parameters:
        - name: claim_id
          in: query
          schema:
            type: string
        - name: taint
          in: query
          schema:
            type: string
            enum: [trusted, untrusted, adversarial]
      responses:
        '200':
          description: Evidence list
          content:
            application/json:
              schema:
                type: object
                properties:
                  observations:
                    type: array
                    items:
                      $ref: '#/components/schemas/Observation'

  /ledger/events:
    get:
      tags: [ledger]
      summary: List ledger events
      operationId: listLedgerEvents
      parameters:
        - name: since_checkpoint
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Ledger event list
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items:
                      $ref: '#/components/schemas/LedgerEvent'
                  checkpoint:
                    type: integer

  /secrets:
    post:
      tags: [secrets]
      summary: Create secret handle
      operationId: createSecret
      description: |
        Creates a brokered secret handle. Secrets are never returned in
        plaintext; the handle is used to reference the secret in effect
        dispatch (INV-006).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, scope]
              properties:
                name:
                  type: string
                scope:
                  type: string
                  enum: [mission, worker, global]
                ttl_seconds:
                  type: integer
      responses:
        '201':
          description: Secret handle created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecretHandle'

  /approvals:
    get:
      tags: [approvals]
      summary: List approval grants
      operationId: listApprovals
      description: |
        Lists owner approval grants and whether each has been redeemed. An
        exact-effect approval authorises exactly one crossing (AUT-003).
      responses:
        '200':
          description: Approval grant list
          content:
            application/json:
              schema:
                type: object
                properties:
                  approvals:
                    type: array
                    items:
                      $ref: '#/components/schemas/ApprovalGrant'
    post:
      tags: [approvals]
      summary: Issue an approval grant
      operationId: issueApproval
      description: |
        Records an owner decision authorising either one exact effect digest or
        a bounded capability scope. This is the human gate in front of
        `POST /host/commit`: obtain the digest from `POST /host/plan`, approve
        it here, then commit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalGrant'
      responses:
        '201':
          description: Approval recorded durably
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalGrant'
        '400':
          $ref: '#/components/responses/BadRequest'

  /approvals/{grant_id}/redeem:
    post:
      tags: [approvals]
      summary: Redeem an approval grant
      operationId: redeemApproval
      description: |
        Marks an approval as spent. `POST /host/commit` performs this itself for
        the approval it consumes; calling it directly is for surfaces that
        redeem an approval outside the host path.
      parameters:
        - name: grant_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Approval redeemed
          content:
            application/json:
              schema:
                type: object
                properties:
                  grant_id:
                    type: string
                  redeemed:
                    type: boolean
                  grant:
                    $ref: '#/components/schemas/ApprovalGrant'
        '409':
          description: Already redeemed, or no such grant
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /tools/read-only:
    post:
      tags: [tools]
      summary: Run a read-only local tool
      operationId: readOnlyTool
      description: |
        Runs one non-consequential tool (`list_directory`, `read_file`,
        `search_text`) confined to the capability root, under byte and entry
        budgets. Nothing here can change the host: consequential operations go
        through `POST /host/plan` and `POST /host/commit`.

        Every call seals an observation tainted `LOCAL_READ_ONLY`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [tool, path]
              properties:
                tool:
                  type: string
                  enum: [list_directory, read_file, search_text]
                path:
                  type: string
                needle:
                  type: string
                  description: Required for search_text.
      responses:
        '200':
          description: Tool result, with its sealed observation id
          content:
            application/json:
              schema:
                type: object
                required: [tool, path, result, observation_id]
                properties:
                  tool:
                    type: string
                  path:
                    type: string
                  result: {}
                  observation_id:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'

  /host/plans:
    get:
      tags: [host]
      summary: List host mutation plans
      operationId: listHostPlans
      description: |
        Lists every declared host mutation and its fate (PLANNED, COMMITTED, or
        REFUSED), plus the count of one-shot permit nonces burned so far.

        This is the audit view of the privilege boundary: every attempted
        crossing appears here whether it was admitted or denied.
      responses:
        '200':
          description: Host plans and burned-nonce count
          content:
            application/json:
              schema:
                type: object
                required: [plans, burned_nonces]
                properties:
                  plans:
                    type: array
                    items:
                      $ref: '#/components/schemas/HostPlan'
                  burned_nonces:
                    type: integer
                    description: Count of one-shot permit nonces spent (durable).

  /host/plan:
    post:
      tags: [host]
      summary: Declare a host mutation
      operationId: planHostOp
      description: |
        Declares a typed host operation as a durable effect intent and returns
        the effect digest an owner must approve (EFX-001).

        This endpoint reaches no executor and changes nothing on the host: a
        plan is a declaration, not authority. The capability grant must already
        cover the operation and resource, otherwise the plan is refused before
        it is recorded (deny-by-default).

        Requires the daemon to be started with `--host-root`; without it the
        host surface is disabled and every request is refused with 503.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HostPlanRequest'
      responses:
        '201':
          description: Mutation declared; nothing has crossed the boundary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostPlanResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          description: Host mutation surface is disabled (no --host-root)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /host/commit:
    post:
      tags: [host]
      summary: Commit a declared host mutation
      operationId: commitHostOp
      description: |
        Redeems a durable approval grant for the plan's exact effect digest,
        re-validates authority and the resource witness at the boundary, issues
        a one-shot CommitPermit bound to this connector identity, and only then
        asks the privilege broker to admit the operation (KRN-002, EFX-004,
        AUT-003).

        The one-shot nonce is burned durably before the response returns, so the
        guarantee survives a restart. The approval is spent in the same step: an
        exact-effect approval authorises exactly one crossing.

        Refusals: no approval for this digest (400), resource witness drifted
        since planning (409), plan already committed (409), privilege boundary
        denied the crossing (409), host surface disabled (503).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HostCommitRequest'
      responses:
        '200':
          description: The host was changed through the privilege boundary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostCommitResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Witness drift, spent plan, or boundary denial
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '503':
          description: Host mutation surface is disabled (no --host-root)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        Operator bearer token (`Authorization: Bearer <token>`). Required on
        every operation except `GET /health` and `GET /ready`. Transport only:
        it never substitutes for capability grants or approvals.
  parameters:
    MissionId:
      name: mission_id
      in: path
      required: true
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        format: uuid
      description: Idempotency key for mutation deduplication

  schemas:
    ChatMessage:
      type: object
      additionalProperties: false
      required: [role, content]
      properties:
        role:
          type: string
          enum: [system, user, assistant]
        content:
          type: string
          minLength: 1
          maxLength: 32768

    ChatRequest:
      type: object
      additionalProperties: false
      required: [messages]
      properties:
        messages:
          type: array
          minItems: 1
          maxItems: 64
          items:
            $ref: '#/components/schemas/ChatMessage'

    ChatResponse:
      type: object
      required: [content, model]
      properties:
        content:
          type: string
        model:
          type: string

    Mission:
      type: object
      properties:
        mission_id:
          type: string
        state:
          type: string
          enum: [CREATED, READY, RUNNING, WAITING, APPROVAL_REQUIRED, PAUSED, DEGRADED, BLOCKED, SUCCEEDED, FAILED, CANCELLED, UNSATISFIABLE, REJECTED]
        goal:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    MissionCreate:
      type: object
      additionalProperties: false
      required:
        - goal
        - success_criteria
        - constraints
        - budgets
        - authority_profile_ref
        - evidence_requirements
        - stopping_rules
      properties:
        goal:
          type: string
          minLength: 1
        success_criteria:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
        constraints:
          type: array
          items:
            type: string
            minLength: 1
        budgets:
          type: object
          minProperties: 1
          additionalProperties:
            type: integer
            minimum: 1
        authority_profile_ref:
          type: string
          minLength: 1
        evidence_requirements:
          type: array
          items:
            type: string
            minLength: 1
        stopping_rules:
          type: array
          items:
            type: string
            minLength: 1
        context:
          type: object
        priority:
          type: string
          enum: [low, normal, high, critical]

    EffectIntent:
      type: object
      required: [effect_id, mission_id, capability_id, target_id, canonical_request_digest, effect_class, risk_class]
      properties:
        effect_id:
          type: string
        mission_id:
          type: string
        capability_id:
          type: string
        target_id:
          type: string
        canonical_request_digest:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
          description: Canonical (RFC 8785) request digest, sha256:<64 hex>
        external_operation_id:
          type: [string, 'null']
        effect_class:
          type: string
        risk_class:
          type: string
        idempotency:
          type: object
        preconditions:
          type: array
          items:
            type: object
        postconditions:
          type: array
          items:
            type: object
        reconciliation:
          type: object
        compensation:
          type: [object, 'null']
        dependencies:
          type: array
          items:
            type: string

    EffectResult:
      type: object
      properties:
        effect_id:
          type: string
        state:
          type: string
          enum: [PENDING, DISPATCHED, UNKNOWN_OUTCOME, SUCCEEDED, FAILED, COMPENSATING, COMPENSATED]
        dispatched_at:
          type: string
          format: date-time
        reconciled_at:
          type: [string, 'null']
          format: date-time

    CapabilityGrant:
      type: object
      properties:
        grant_id:
          type: string
        subject_id:
          type: string
        workload_id:
          type: string
        operations:
          type: array
          items:
            type: string
        resources:
          type: object
        validity:
          type: object
        delegation_depth:
          type: integer
        generation:
          type: integer

    Observation:
      type: object
      properties:
        observation_id:
          type: string
        claim_id:
          type: string
        taint:
          type: string
          enum: [trusted, untrusted, adversarial]
        content:
          type: string
        observed_at:
          type: string
          format: date-time
        provenance:
          type: object

    LedgerEvent:
      type: object
      properties:
        event_id:
          type: integer
        event_type:
          type: string
        payload_hash:
          type: string
        previous_hash:
          type: string
        timestamp:
          type: string
          format: date-time

    SecretHandle:
      type: object
      properties:
        handle_id:
          type: string
        name:
          type: string
        scope:
          type: string
        created_at:
          type: string
          format: date-time
        expires_at:
          type: [string, 'null']
          format: date-time

    ProblemDetail:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string

    HostOp:
      description: |
        A single host-administration operation. The set is closed and internally
        tagged on `op`: there is no "run arbitrary command" variant, and an
        unknown tag is refused at deserialization (deny-by-default).
      oneOf:
        - type: object
          additionalProperties: false
          required: [op, path, contents]
          properties:
            op:
              const: write_file
            path:
              type: string
              description: Absolute path, resolved inside the sandbox root.
            contents:
              type: string
        - type: object
          additionalProperties: false
          required: [op, path]
          properties:
            op:
              const: remove_file
            path:
              type: string
        - type: object
          additionalProperties: false
          required: [op, program, args]
          properties:
            op:
              const: spawn_process
            program:
              type: string
              description: Absolute path inside the sandbox; never resolved through PATH.
            args:
              type: array
              items:
                type: string
        - type: object
          additionalProperties: false
          required: [op, interface, allow_cidr]
          properties:
            op:
              const: configure_network
            interface:
              type: string
            allow_cidr:
              type: string
              description: IPv4 CIDR. Refused by the filesystem sandbox executor.
      discriminator:
        propertyName: op

    ResourceWitness:
      type: object
      description: |
        The observed version of a resource. `kind` is `sha256` for an existing
        file or `absent` when the resource does not exist — an absent resource is
        a witness too, so creating a file somebody else created is drift.
      required: [kind, resource_id, value]
      properties:
        kind:
          type: string
        resource_id:
          type: string
        value:
          type: string

    HostPlanRequest:
      type: object
      additionalProperties: false
      required: [mission_id, grant_id, op]
      properties:
        mission_id:
          type: string
        grant_id:
          type: string
          description: The capability grant the authority must come from.
        op:
          $ref: '#/components/schemas/HostOp'

    HostPlanResponse:
      type: object
      required:
        - plan_id
        - mission_id
        - grant_id
        - operation
        - resource_type
        - resource_id
        - effect_digest
        - planned_witness
        - state
      properties:
        plan_id:
          type: string
        mission_id:
          type: string
        grant_id:
          type: string
        operation:
          type: string
          enum: [write, delete, spawn, configure]
        resource_type:
          type: string
          enum: [file, process, network]
        resource_id:
          type: string
        effect_digest:
          type: string
          description: The identity an exact-effect approval must name.
        planned_witness:
          $ref: '#/components/schemas/ResourceWitness'
        state:
          const: PLANNED

    HostCommitRequest:
      type: object
      additionalProperties: false
      required: [plan_id]
      properties:
        plan_id:
          type: string

    HostCommitResponse:
      type: object
      required:
        - plan_id
        - permit_id
        - one_shot_nonce
        - approval_id
        - effect_digest
        - outcome
        - observation_id
        - state
      properties:
        plan_id:
          type: string
        permit_id:
          type: string
        one_shot_nonce:
          type: string
          description: Burned durably before this response returned.
        approval_id:
          type: string
        effect_digest:
          type: string
        outcome:
          type: string
          description: The executor's own account of what it did.
        observation_id:
          type: string
          description: The sealed evidence entry, tainted HOST_MUTATION_COMMITTED.
        state:
          const: COMMITTED

    HostPlan:
      type: object
      description: A declared mutation and its fate, as recorded in the ledger.
      required: [plan_id, state]
      properties:
        plan_id:
          type: string
        mission_id:
          type: string
        grant_id:
          type: string
        operation:
          type: string
        resource_type:
          type: string
        resource_id:
          type: string
        effect_id:
          type: string
        effect_digest:
          type: string
        planned_witness:
          $ref: '#/components/schemas/ResourceWitness'
        state:
          type: string
          enum: [PLANNED, COMMITTED, REFUSED]
        refusal:
          type: string
          description: Present when state is REFUSED; why the crossing was denied.
        permit_id:
          type: string
        one_shot_nonce:
          type: string
        observation_id:
          type: string

    ValidityInterval:
      type: object
      description: A half-open interval `[not_before, expires_at)`.
      required: [not_before, expires_at]
      properties:
        not_before:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time

    ApprovalScope:
      description: |
        The mutually exclusive scopes AUT-003 permits. An `effect` scope names one
        exact effect digest; a `capability` scope bounds an operation class.
        Effect and capability targets never cross-match.
      oneOf:
        - type: object
          additionalProperties: false
          required: [kind, effect_digest]
          properties:
            kind:
              const: effect
            effect_digest:
              type: string
        - type: object
          required: [kind]
          properties:
            kind:
              const: capability
      discriminator:
        propertyName: kind

    ApprovalGrant:
      type: object
      description: A durable owner decision that can authorise a crossing.
      required: [grant_id, approver_id, scope, validity]
      properties:
        grant_id:
          type: string
        approver_id:
          type: string
          description: The human or authority that approved the scope.
        scope:
          $ref: '#/components/schemas/ApprovalScope'
        validity:
          $ref: '#/components/schemas/ValidityInterval'
        revocation_state:
          type: string
          enum: [ACTIVE, REVOKED, EXPIRED]
        generation:
          type: integer
        redeemed:
          type: boolean
          description: Whether this approval has already been spent.
        attestation:
          type: object
          description: |
            Daemon attestation stapled at issue (P0-B). Proves the approval
            passed through this daemon's authenticated API unmodified since.
            Absent on pre-attestation records. Does not identify a human.
          properties:
            key_id:
              type: string
            signature:
              type: string
          required: [key_id, signature]

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    KernelDenied:
      description: Kernel authorization denied
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
