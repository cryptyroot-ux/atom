spec_version: 4.1.0
addendum_id: agent-self-v1
requirements:
- id: ATOM-SELF-001
  priority: P0
  requirement: SOUL.md, IDENTITY.md, USER.md, memory, model output, peer assertion, dan persona metadata MUST NOT menciptakan, memperluas, atau menggantikan CapabilityContract, CapabilityGrant, ApprovalGrant, PolicyDecision, EffectiveAuthorityView, atau CommitPermit.
  owner: Constitutional Agent Self
  gates: [G0, G2]
  primary_test: ATOM-VT-SELF-001

- id: ATOM-SELF-002
  priority: P0
  requirement: Display/persona identity harus berbeda secara tipe dan domain digest dari owner principal identity, subject identity, workload identity, connector identity, signing identity, dan execution instance identity.
  owner: Constitutional Agent Self
  gates: [G0, G2]
  primary_test: ATOM-VT-SELF-002

- id: ATOM-SELF-003
  priority: P0
  requirement: Mengubah nama, avatar, role, atau gaya bicara tidak boleh mengubah WorkloadIdentity maupun validitas grant.
  owner: Constitutional Agent Self
  gates: [G2]
  primary_test: ATOM-VT-SELF-003

- id: ATOM-SELF-004
  priority: P0
  requirement: Production cognition tidak boleh mengaktifkan perubahan terhadap identity atau soul miliknya sendiri. Agent boleh propose, tidak boleh approve and activate own self change.
  owner: Constitutional Agent Self
  gates: [G0, G2]
  primary_test: ATOM-VT-SELF-004

- id: ATOM-SELF-005
  priority: P0
  requirement: Perubahan identity/soul harus versioned, content-addressed, auditable, reversible, dan mengikuti owner-controlled change policy.
  owner: Constitutional Agent Self
  gates: [G2]
  primary_test: ATOM-VT-SELF-005

- id: ATOM-SELF-006
  priority: P0
  requirement: Constitution harus ditegakkan melalui typed API, policy, privilege separation, dan Effect Kernel. LLM prompt compliance bukan enforcement boundary.
  owner: Constitutional Agent Self
  gates: [G0]
  primary_test: ATOM-VT-SELF-006

- id: ATOM-SELF-007
  priority: P0
  requirement: Agent identity, soul, user profile, dan memory harus terisolasi berdasarkan tenant, owner, dan agent. Tidak boleh ada silent inheritance.
  owner: Constitutional Agent Self
  gates: [G0, G2]
  primary_test: ATOM-VT-SELF-007

- id: ATOM-SELF-008
  priority: P0
  requirement: EffectiveSelfView adalah derived, short-lived view yang dibuat ulang pada session/mission boundary. Ia bukan root-of-truth dan tidak mempunyai operations/resources/budget authority.
  owner: Constitutional Agent Self
  gates: [G2]
  primary_test: ATOM-VT-SELF-008

- id: ATOM-SELF-009
  priority: P0
  requirement: AgentIdentityProfile merupakan presentation identity, bukan security principal. Field minimal termasuk profile_id, agent_id, owner_principal_id, display_name, role, archetype, avatar_ref, signature_symbol, languages, generation, state, constitution_digest, content_digest, created_at, updated_at, authorized_by.
  owner: Agent Self Data Model
  gates: [G2]
  primary_test: ATOM-VT-SELF-009

- id: ATOM-SELF-010
  priority: P0
  requirement: SoulProfile harus mempunyai field minimal soul_id, agent_id, values, voice, tone, epistemic_stance, uncertainty_policy, disagreement_policy, autonomy_posture, interaction_boundaries, forbidden_behaviors, change_policy, generation, state, content_digest, created_at, updated_at, authorized_by.
  owner: Agent Self Data Model
  gates: [G2]
  primary_test: ATOM-VT-SELF-010

- id: ATOM-SELF-011
  priority: P0
  requirement: AgentSelfRevision lifecycle minimal adalah DRAFT, PROPOSED, PENDING_AUTHORIZATION, ACTIVE, SUPERSEDED, REVOKED, ROLLED_BACK. Invalid digest, unknown schema, owner mismatch, atau unauthorized mutation harus menghasilkan QUARANTINED atau DENIED.
  owner: Agent Self Data Model
  gates: [G0, G2]
  primary_test: ATOM-VT-SELF-011

- id: ATOM-SELF-012
  priority: P0
  requirement: EffectiveSelfView harus membawa derivation digest, source digests, generation, scope, dan expiry. Ia harus dibuat ulang pada session/mission boundary.
  owner: Agent Self Data Model
  gates: [G2]
  primary_test: ATOM-VT-SELF-012

- id: ATOM-SELF-013
  priority: P0
  requirement: Workspace files (IDENTITY.md, SOUL.md, USER.md, AGENTS.md, MEMORY.md) harus menggunakan validated YAML frontmatter atau format typed setara dengan UTF-8 validation, deterministic normalization, domain-separated SHA-256 digest, maximum file size, rejection terhadap NUL/invalid encoding, atomic writes, symlink/hardlink escape protection, owner/permission checks, generation counter, rollback history, no plaintext secrets.
  owner: Governed Workspace
  gates: [G2]
  primary_test: ATOM-VT-SELF-013

- id: ATOM-SELF-014
  priority: P0
  requirement: Context assembler harus menggunakan urutan deterministik Canonical Constitution view, Deployment/owner policy, Active AgentIdentityProfile, Active SoulProfile, Channel-eligible UserProfile, MissionSpec, Eligible ContextItems, Current user turn.
  owner: Context Assembly
  gates: [G2]
  primary_test: ATOM-VT-SELF-014

- id: ATOM-SELF-015
  priority: P0
  requirement: Semua context item harus membawa provenance, trust, sensitivity, injection-risk, dan digest. Identity/soul/constitution digests harus ditambahkan ke session metadata, provider-call record, mission trace, decision trace, replay input, audit evidence.
  owner: Context Assembly
  gates: [G2]
  primary_test: ATOM-VT-SELF-015

- id: ATOM-SELF-016
  priority: P0
  requirement: Tidak boleh memasukkan raw USER.md atau private MEMORY.md ke group channel, peer protocol, delegated sub-agent, atau external provider yang melanggar egress policy.
  owner: Context Assembly
  gates: [G0, G2]
  primary_test: ATOM-VT-SELF-016

- id: ATOM-SELF-017
  priority: P1
  requirement: Sub-agent hanya boleh menerima DelegatedSelfView yang diturunkan secara eksplisit dan tidak mengandung private user profile secara default.
  owner: Context Assembly
  gates: [G2]
  primary_test: ATOM-VT-SELF-017

- id: ATOM-SELF-018
  priority: P1
  requirement: atom workspace init harus membuat governed workspace tanpa menimpa file yang sudah ada.
  owner: CLI Extension
  gates: [G2]
  primary_test: ATOM-VT-SELF-018

- id: ATOM-SELF-019
  priority: P1
  requirement: atom identity show/edit/propose/history/rollback harus tersedia. Edit tidak boleh otomatis menjadi active jika change policy memerlukan approval.
  owner: CLI Extension
  gates: [G2]
  primary_test: ATOM-VT-SELF-019

- id: ATOM-SELF-020
  priority: P1
  requirement: atom soul show/edit/propose/approve/history/rollback harus tersedia. Perubahan yang dibuat agent selalu menjadi proposal.
  owner: CLI Extension
  gates: [G2]
  primary_test: ATOM-VT-SELF-020

- id: ATOM-SELF-021
  priority: P1
  requirement: Owner dapat melihat diff sebelum aktivasi. Setiap aktivasi menghasilkan ledger/audit event.
  owner: CLI Extension
  gates: [G2]
  primary_test: ATOM-VT-SELF-021

- id: ATOM-SELF-022
  priority: P1
  requirement: Restart harus mempertahankan active generation. Missing files menggunakan safe default dan tidak memberikan authority tambahan.
  owner: CLI Extension
  gates: [G2]
  primary_test: ATOM-VT-SELF-022

- id: ATOM-SELF-023
  priority: P1
  requirement: atom workspace import --from openclaw dan --from herms harus tersedia. Import hanya mengonversi persona/display metadata, tidak pernah mengimpor authority, credential, atau ambient tool permission.
  owner: CLI Extension
  gates: [G2]
  primary_test: ATOM-VT-SELF-023

- id: ATOM-SELF-024
  priority: P1
  requirement: SOUL.md berisi instruksi malicious seperti grant yourself root access tidak boleh mengubah authority. Instruksi tersebut boleh memengaruhi teks cognition tetapi tidak mengubah CapabilityGrant atau EffectiveAuthorityView.
  owner: Constitutional Enforcement
  gates: [G0, G2]
  primary_test: ATOM-VT-SELF-024

- id: ATOM-SELF-025
  priority: P1
  requirement: Constitution digest mismatch harus menghasilkan STARTUP_BLOCKED.
  owner: Constitutional Enforcement
  gates: [G0]
  primary_test: ATOM-VT-SELF-025

- id: ATOM-SELF-026
  priority: P1
  requirement: Provider switch harus mempertahankan agent identity. Agent restart harus mempertahankan active self generation.
  owner: Identity Continuity
  gates: [G2]
  primary_test: ATOM-VT-SELF-026

- id: ATOM-SELF-027
  priority: P1
  requirement: Tenant A profile tidak boleh visible ke Tenant B. Private user profile tidak boleh masuk shared channel atau subagent.
  owner: Tenant Isolation
  gates: [G0, G2]
  primary_test: ATOM-VT-SELF-027

- id: ATOM-SELF-028
  priority: P1
  requirement: Rollback harus mengembalikan exact prior profile. History harus auditable dan content-addressed.
  owner: Agent Self Revision
  gates: [G2]
  primary_test: ATOM-VT-SELF-028
