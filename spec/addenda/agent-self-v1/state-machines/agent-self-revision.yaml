version: 1.0.0
name: AgentSelfRevision
description: Lifecycle for agent identity/soul revisions
initial: DRAFT
terminals: [SUPERSEDED, REVOKED, ROLLED_BACK, QUARANTINED, DENIED]
states:
  - DRAFT
  - PROPOSED
  - PENDING_AUTHORIZATION
  - ACTIVE
  - SUPERSEDED
  - REVOKED
  - ROLLED_BACK
  - QUARANTINED
  - DENIED
transitions:
  - { from: DRAFT, to: PROPOSED, trigger: propose }
  - { from: DRAFT, to: DENIED, trigger: deny }
  - { from: PROPOSED, to: PENDING_AUTHORIZATION, trigger: request_authorization }
  - { from: PROPOSED, to: DENIED, trigger: deny }
  - { from: PENDING_AUTHORIZATION, to: ACTIVE, trigger: authorize, constraint: owner_approval_required }
  - { from: PENDING_AUTHORIZATION, to: DENIED, trigger: deny }
  - { from: ACTIVE, to: SUPERSEDED, trigger: supersede }
  - { from: ACTIVE, to: REVOKED, trigger: revoke }
  - { from: ACTIVE, to: ROLLED_BACK, trigger: rollback }
  - { from: '*', to: QUARANTINED, trigger: invariant_violation_or_tampering }
