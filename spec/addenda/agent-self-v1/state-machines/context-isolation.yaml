version: 1.0.0
name: ContextIsolation
description: Ensures tenant/channel isolation for profiles
initial: ASSEMBLING
terminals: [ALLOWED, DENIED]
states:
  - ASSEMBLING
  - ALLOWED
  - DENIED
transitions:
  - { from: ASSEMBLING, to: ALLOWED, trigger: tenant_match }
  - { from: ASSEMBLING, to: DENIED, trigger: tenant_mismatch_or_egress_violation }
