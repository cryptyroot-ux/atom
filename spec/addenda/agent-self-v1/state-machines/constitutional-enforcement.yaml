version: 1.0.0
name: ConstitutionalEnforcement
description: Validates constitution digest and blocks startup on mismatch
initial: VERIFYING
terminals: [ENFORCED, BLOCKED]
states:
  - VERIFYING
  - ENFORCED
  - BLOCKED
transitions:
  - { from: VERIFYING, to: ENFORCED, trigger: digest_valid }
  - { from: VERIFYING, to: BLOCKED, trigger: digest_mismatch }
