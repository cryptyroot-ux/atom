spec_version: 4.1.0
addendum_id: agent-self-v1
invariants:
- id: ATOM-INV-SELF-001
  invariant: Persona metadata MUST NOT appear in any authorization evaluation path.
  enforcement: Type system + Effect Kernel

- id: ATOM-INV-SELF-002
  invariant: WorkloadIdentity digest MUST NOT change when display name, avatar, or role changes.
  enforcement: Domain-separated content-addressed identity

- id: ATOM-INV-SELF-003
  invariant: Self-approval MUST NOT activate a self-change proposal.
  enforcement: Owner-controlled change policy + audit logging

- id: ATOM-INV-SELF-004
  invariant: EffectiveSelfView MUST expire at session/mission boundary.
  enforcement: Short-lived cache with derivation digest

- id: ATOM-INV-SELF-005
  invariant: Private user profile MUST NOT cross tenant or channel boundaries.
  enforcement: Context assembly + egress policy

- id: ATOM-INV-SELF-006
  invariant: Constitution enforcement MUST rely on typed API, not LLM prompt compliance.
  enforcement: Policy Decision + Effect Kernel
