spec_version: 4.1.0
addendum_id: agent-self-v1
rules:
- id: ATOM-SEM-SELF-001
  applies_to: agent-identity-profile
  contract: AgentIdentityProfile MUST be presentation identity, NOT security principal. Changing display_name, avatar, role, or signature_symbol MUST NOT alter WorkloadIdentity digest or CapabilityGrant validity.
  reference_hook: atom-agent-profile::semantic_identity

- id: ATOM-SEM-SELF-002
  applies_to: soul-profile
  contract: SoulProfile MUST NOT contain operations, resources, budget, or authority. It shapes cognition style only. Malicious content in SOUL.md MUST NOT escalate authority.
  reference_hook: atom-agent-profile::semantic_soul

- id: ATOM-SEM-SELF-003
  applies_to: agent-self-revision
  contract: Self-change proposal MUST go through DRAFT, PROPOSED, PENDING_AUTHORIZATION, ACTIVE. Agent MAY propose but MUST NOT approve own change. Owner authorization REQUIRED.
  reference_hook: atom-agent-profile::semantic_self_revision

- id: ATOM-SEM-SELF-004
  applies_to: effective-self-view
  contract: EffectiveSelfView MUST be derived, short-lived, and regenerated at session/mission boundary. It MUST NOT be accepted as authority input. It carries derivation_digest, source_digests, generation, scope, expiry.
  reference_hook: atom-agent-profile::semantic_effective_self

- id: ATOM-SEM-SELF-005
  applies_to: context-assembly
  contract: Context MUST be assembled in deterministic order - Constitution, OwnerPolicy, AgentIdentityProfile, SoulProfile, UserProfile, MissionSpec, ContextItems, UserTurn. All items carry provenance, trust, sensitivity, injection-risk, digest.
  reference_hook: atom-context::semantic_assembly

- id: ATOM-SEM-SELF-006
  applies_to: tenant-isolation
  contract: Agent identity, soul, user profile, memory MUST be isolated by tenant, owner, agent. No silent inheritance across users, agents, restored instances, shared channels, or delegated sub-agents.
  reference_hook: atom-agent-profile::semantic_tenant

- id: ATOM-SEM-SELF-007
  applies_to: constitutional-enforcement
  contract: Constitution MUST be enforced via typed API, policy, privilege separation, and Effect Kernel. LLM prompt compliance is NOT enforcement boundary. Digest mismatch MUST block startup.
  reference_hook: atom-kernel::semantic_constitution

- id: ATOM-SEM-SELF-008
  applies_to: workspace-import
  contract: Import from OpenClaw/Hermes MUST convert persona/display metadata only. MUST NOT import authority, credentials, or ambient tool permissions.
  reference_hook: atom-agent-profile::semantic_import
