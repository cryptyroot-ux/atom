spec_version: 4.1.0
source_document: ATOM_PRD_v4.1
requirements:
- id: ATOM-V4-KRN-001
  priority: P0
  phase: v4.0-alpha
  requirement: All consequential mutation paths MUST traverse typed capability authorization
    and Effect Kernel commit revalidation.
  owner: Sovereign Kernel
  gates:
  - G0
  - G2
  primary_test: ATOM-VT41-001
- id: ATOM-V4-KRN-002
  priority: P0
  phase: v4.0-alpha
  requirement: The main runtime MUST operate unprivileged; host administration MUST
    be mediated by atom-privd typed operations and valid CommitPermit.
  owner: Sovereign Kernel
  gates:
  - G0
  - G2
  primary_test: ATOM-VT41-002
- id: ATOM-V4-AUT-001
  priority: P0
  phase: v4.0-alpha
  requirement: CapabilityGrant MUST bind subject/workload identity, operation, resource
    selector, purpose, validity interval, budget, delegation depth, audience, generation,
    revocation and parent grant where delegated.
  owner: Authority & Policy
  gates:
  - G0
  - G2
  primary_test: ATOM-VT41-003
- id: ATOM-V4-AUT-002
  priority: P0
  phase: v4.0-alpha
  requirement: Delegation MUST be syntactically and semantically subset-only.
  owner: Authority & Policy
  gates:
  - G0
  - G2
  primary_test: ATOM-VT41-004
- id: ATOM-V4-AUT-003
  priority: P0
  phase: v4.0-alpha
  requirement: Approvals MUST be durable ApprovalGrants scoped to exact effect or
    bounded capability/resource envelope.
  owner: Authority & Policy
  gates:
  - G0
  - G2
  primary_test: ATOM-VT41-005
- id: ATOM-V4-EFX-001
  priority: P0
  phase: v4.0-alpha
  requirement: Every consequential mutation MUST persist EffectIntent before dispatch.
  owner: Effect Kernel
  gates:
  - G0
  - G2
  primary_test: ATOM-VT41-006
- id: ATOM-V4-EFX-002
  priority: P0
  phase: v4.0-alpha
  requirement: EffectIntent MUST include canonical request digest, target, idempotency
    semantics, external operation identity when available, pre/postconditions, reconciliation
    class, compensation semantics and dependency edges.
  owner: Effect Kernel
  gates:
  - G0
  - G2
  primary_test: ATOM-VT41-007
- id: ATOM-V4-EFX-003
  priority: P0
  phase: v4.0-alpha
  requirement: Ambiguous post-dispatch outcome MUST enter UNKNOWN_OUTCOME and block
    dependent mutations until reconciled or explicitly dispositioned by authorized
    policy.
  owner: Effect Kernel
  gates:
  - G0
  - G2
  primary_test: ATOM-VT41-008
- id: ATOM-V4-EFX-004
  priority: P0
  phase: v4.0-alpha
  requirement: CommitPermit MUST be short-lived, one-shot and bound to effect digest,
    resource witness, principal, grant generation and optional approval/evidence freshness
    digest.
  owner: Effect Kernel
  gates:
  - G0
  - G2
  primary_test: ATOM-VT41-009
- id: ATOM-V4-LED-001
  priority: P0
  phase: v4.0-alpha
  requirement: Authoritative event streams MUST use monotonic sequence, previous-event
    hash and canonical event hash; checkpoints MUST seal stream heads.
  owner: Ledger & Durability
  gates:
  - G0
  - G3
  primary_test: ATOM-VT41-010
- id: ATOM-V4-MSN-001
  priority: P0
  phase: v4.0-alpha
  requirement: Mission MUST be the durable objective primitive and MUST define goal,
    success criteria, constraints, budgets, authority envelope, evidence requirements
    and stopping rules.
  owner: Mission Runtime
  gates:
  - G0
  - G3
  primary_test: ATOM-VT41-011
- id: ATOM-V4-MSN-002
  priority: P0
  phase: v4.0-alpha
  requirement: Mission state MUST use canonical phase/condition/outcome axes from
    spec/enums.yaml.
  owner: Mission Runtime
  gates:
  - G0
  - G3
  primary_test: ATOM-VT41-012
- id: ATOM-V4-MSN-003
  priority: P0
  phase: v4.0-alpha
  requirement: Mission execution MUST use deterministic reducers for authoritative
    state and durable events for nondeterministic activity results.
  owner: Mission Runtime
  gates:
  - G0
  - G3
  primary_test: ATOM-VT41-013
- id: ATOM-V4-COG-001
  priority: P0
  phase: v4.0-alpha
  requirement: ATOM MUST provide a native provider-agnostic cognition loop sufficient
    for context assembly, structured tool/capability proposal, cancellation, evidence
    capture and usage accounting without Hermes/OpenClaw.
  owner: Native Cognition
  gates:
  - G0
  - G2
  primary_test: ATOM-VT41-014
- id: ATOM-V4-CXT-001
  priority: P0
  phase: v4.0-alpha
  requirement: Every context item MUST carry provenance, trust, sensitivity and injection-risk
    labels, and transformations MUST preserve taint unless governed declassification
    occurs.
  owner: Context & Memory
  gates:
  - G0
  - G2
  primary_test: ATOM-VT41-015
- id: ATOM-V4-SEC-001
  priority: P0
  phase: v4.0-alpha
  requirement: Secrets MUST be delivered by SecretHandle with audience, principal,
    mission, capability, target, operation, expiry, redemptions and generation constraints.
  owner: Product Security
  gates:
  - G0
  - G2
  primary_test: ATOM-VT41-016
- id: ATOM-V4-SCH-001
  priority: P0
  phase: v4.0-alpha
  requirement: Schedules MUST define timezone, DST, misfire, overlap, catch-up, dedupe,
    lateness, authority profile and cancellation semantics.
  owner: Scheduler
  gates:
  - G0
  - G3
  primary_test: ATOM-VT41-017
- id: ATOM-V4-OBS-001
  priority: P0
  phase: v4.0-alpha
  requirement: External reality observations MUST be provenance- and freshness-aware
    and distinguish observation from model assertion.
  owner: Evidence & Observability
  gates:
  - G0
  - G7
  primary_test: ATOM-VT41-018
- id: ATOM-V4-RPL-001
  priority: P0
  phase: v4.0-alpha
  requirement: ATOM MUST implement R0-R2 replay for alpha and MUST label R3/R4 semantics
    explicitly; no universal exact-replay claim is allowed.
  owner: Replay & Simulation
  gates:
  - G0
  - G3
  primary_test: ATOM-VT41-019
- id: ATOM-V4-OPS-001
  priority: P0
  phase: v4.0-alpha
  requirement: Official Linux install MUST support one-command bootstrap, native-only
    setup, clean rollback and no mandatory Redis/Kafka/Kubernetes/external database.
  owner: Operations
  gates:
  - G0
  - G5
  primary_test: ATOM-VT41-020
- id: ATOM-V4-UI-001
  priority: P0
  phase: v4.0-alpha
  requirement: Web/PWA MUST expose mission, grant, approval, effect, UNKNOWN_OUTCOME
    reconciliation, evidence, cost and recovery state without flattening uncertainty.
  owner: Mission Control
  gates:
  - G0
  - G6
  primary_test: ATOM-VT41-021
- id: ATOM-V4-EXT-001
  priority: P0
  phase: v4.0-alpha
  requirement: Untrusted/generated extensions MUST not run in-process with the sovereign
    core and MUST not directly reach secrets, authoritative DB, atom-privd or host
    Docker socket.
  owner: Extension Platform
  gates:
  - G0
  - G4
  primary_test: ATOM-VT41-022
- id: ATOM-V4-SUP-001
  priority: P0
  phase: v4.0-alpha
  requirement: Official and Foundry executable artifacts MUST be content-addressed
    and include provenance, SBOM, signatures/attestations and immutable identity.
  owner: Supply Chain
  gates:
  - G0
  - G1
  primary_test: ATOM-VT41-023
- id: ATOM-V4-EPI-001
  priority: P1
  phase: v4.1
  requirement: Persistent critical knowledge MUST use typed Claim/Evidence/Observation
    records with provenance DAG, source authority, confidence, valid-time, transaction-time,
    contradiction and taint.
  owner: Epistemics & Memory
  gates:
  - G0
  - G7
  primary_test: ATOM-VT41-024
- id: ATOM-V4-EPI-002
  priority: P1
  phase: v4.1
  requirement: Ingest, store, retrieve, context, decision and effect eligibility MUST
    be separately policy-gated.
  owner: Epistemics & Memory
  gates:
  - G0
  - G7
  primary_test: ATOM-VT41-025
- id: ATOM-V4-FND-001
  priority: P1
  phase: v4.2
  requirement: Tool Foundry MUST synthesize multiple candidate interfaces/implementations
    and gate activation on hermetic build, tests, property/fuzz/adversarial checks,
    hidden holdout and certificate.
  owner: Foundry
  gates:
  - G0
  - G2
  primary_test: ATOM-VT41-026
- id: ATOM-V4-FND-002
  priority: P1
  phase: v4.2
  requirement: Workflow Foundry MUST produce typed durable workflows with explicit
    failure, timeout, retry, reconciliation and compensation transitions.
  owner: Foundry
  gates:
  - G0
  - G2
  primary_test: ATOM-VT41-027
- id: ATOM-V4-FND-003
  priority: P1
  phase: v4.2
  requirement: Verifier Foundry MUST label verifier independence using canonical V0-V5
    taxonomy.
  owner: Foundry
  gates:
  - G0
  - G2
  primary_test: ATOM-VT41-028
- id: ATOM-V4-EXP-001
  priority: P1
  phase: v4.3
  requirement: Experience Compiler MUST generate TaskSignature, mine repeated subtrajectories,
    separate positive/negative examples, synthesize candidate artifacts and evaluate
    on hidden holdout before promotion.
  owner: Experience Compiler
  gates:
  - G0
  - G8
  primary_test: ATOM-VT41-029
- id: ATOM-V4-EXP-002
  priority: P1
  phase: v4.3
  requirement: Experience Compiler MUST NOT emit autonomous authority expansion; it
    MAY emit non-authoritative PolicyRecommendation.
  owner: Experience Compiler
  gates:
  - G0
  - G8
  primary_test: ATOM-VT41-030
- id: ATOM-V4-JIT-001
  priority: P1
  phase: v4.4
  requirement: Recurrent verified deliberative behavior SHOULD compile to cheaper
    workflow/tool/specialist capability when correctness is preserved within policy
    threshold.
  owner: Cognition JIT
  gates:
  - G0
  - G8
  primary_test: ATOM-VT41-031
- id: ATOM-V4-ARC-001
  priority: P1
  phase: v4.5
  requirement: Architecture selection MUST be a constrained policy over topology actions
    with hard safety constraints outside the learner and vector reward including verified
    success, effect integrity, security, cost, latency and human attention.
  owner: Architecture Learning
  gates:
  - G0
  - G8
  primary_test: ATOM-VT41-032
- id: ATOM-V4-FLT-001
  priority: P1
  phase: v4.1
  requirement: Recovery MUST classify faults before selecting retry/reobserve/reauthorize/reconcile/replan
    behavior.
  owner: Reliability
  gates:
  - G0
  - G3
  primary_test: ATOM-VT41-033
- id: ATOM-V4-RST-001
  priority: P0
  phase: v4.0-alpha
  requirement: Local mode MUST not claim clone-proof split-brain safety; Fenced Sovereign
    Mode MUST use an external lease/epoch/connector witness or equivalent.
  owner: Durability & Fencing
  gates:
  - G0
  - G3
  primary_test: ATOM-VT41-034
- id: ATOM-V4-EVO-001
  priority: P1
  phase: v4.6
  requirement: Adaptive artifacts MUST move through LAB -> SIMULATION -> SHADOW ->
    CANARY -> ACTIVE and support automatic downgrade/rollback on regression.
  owner: Evolution Governance
  gates:
  - G0
  - G9
  primary_test: ATOM-VT41-035
- id: ATOM-V4-EVO-002
  priority: P1
  phase: v4.6
  requirement: E7 trusted-core changes and E8 authority/policy expansion MUST NOT
    self-promote from production cognition.
  owner: Evolution Governance
  gates:
  - G0
  - G9
  primary_test: ATOM-VT41-036
- id: ATOM-V4-CER-001
  priority: P1
  phase: v4.2
  requirement: Certificate MUST bind exact BehaviorManifestV2 digest, evaluation suite
    digest, environment scope, verifier class, validity and stale conditions.
  owner: Certification
  gates:
  - G0
  - G8
  primary_test: ATOM-VT41-037
- id: ATOM-V4-BMK-001
  priority: P0
  phase: v4.0-alpha
  requirement: Any 2G superiority claim MUST use pinned competitor/runtime versions,
    same-model and best-native tracks, comparable budgets, multiple seeds, confidence
    intervals, fault/attack scenarios and public failure traces.
  owner: Evaluation Science
  gates:
  - G0
  - G8
  primary_test: ATOM-VT41-038
- id: ATOM-V4-INT-001
  priority: P1
  phase: v4.1
  requirement: MCP/A2A/Agent Skills/Hermes/OpenClaw compatibility MUST be versioned
    profiles outside sovereign core semantics.
  owner: Interoperability
  gates:
  - G0
  - G4
  primary_test: ATOM-VT41-039
- id: ATOM-V4-API-001
  priority: P0
  phase: v4.0-alpha
  requirement: Public write APIs MUST use operation identity/idempotency semantics
    where duplicate dispatch is possible and return typed UNKNOWN/PARTIAL states.
  owner: Developer Platform
  gates:
  - G0
  - G4
  primary_test: ATOM-VT41-040
- id: ATOM-V4-BAS-001
  priority: P0
  phase: v4.1
  requirement: Every published ATOM artifact MUST declare separately its specification
    status, implementation status, gate status, signature status, and claim status;
    a document title MUST NOT imply that unexecuted implementation gates passed.
  owner: Architecture Council
  gates:
  - G0
  primary_test: ATOM-VT41-041
- id: ATOM-V4-BAS-002
  priority: P0
  phase: v4.1
  requirement: Normative precedence MUST be Constitution, canonical machine specification,
    ratified ADR, PRD, Blueprint, and explanatory text in that order; any collision
    MUST fail G0 until resolved by an explicit supersession record.
  owner: Architecture Council
  gates:
  - G0
  primary_test: ATOM-VT41-042
- id: ATOM-V4-BAS-003
  priority: P0
  phase: v4.1
  requirement: The canonical pack MUST be reproducibly generated from versioned source
    records and MUST contain a complete internal file manifest with hashes, media
    types, normative classes, and generation metadata.
  owner: Architecture Council
  gates:
  - G0
  primary_test: ATOM-VT41-043
- id: ATOM-V4-TRC-001
  priority: P0
  phase: v4.1
  requirement: Every normative requirement MUST trace to at least one invariant, owner,
    schema or state contract where applicable, acceptance test, gate, evidence path,
    and source decision; every test MUST trace back to one or more requirements.
  owner: Release Engineering
  gates:
  - G0
  primary_test: ATOM-VT41-044
- id: ATOM-V4-TRC-002
  priority: P0
  phase: v4.1
  requirement: All 184 v3.1 requirement, invariant, and verification IDs MUST have
    an explicit disposition of retained, merged, strengthened, superseded, or deferred-with-contract,
    including target, rationale, phase, owner, and verification impact.
  owner: Release Engineering
  gates:
  - G0
  primary_test: ATOM-VT41-045
- id: ATOM-V4-TRC-003
  priority: P0
  phase: v4.1
  requirement: Gate evidence MUST be machine-readable, content-addressed, timestamped,
    environment-bound, producer-identified, and immutable after gate decision; corrections
    MUST create a superseding record rather than mutate prior evidence.
  owner: Release Engineering
  gates:
  - G0
  primary_test: ATOM-VT41-046
- id: ATOM-V4-SCM-001
  priority: P0
  phase: v4.1
  requirement: All P0 domain objects named by requirements, APIs, events, and state
    machines MUST have canonical JSON Schema 2020-12 definitions with closed object
    boundaries, explicit required fields, enumerations, bounds, identifier patterns,
    and valid and invalid fixtures.
  owner: Contract Engineering
  gates:
  - G0
  primary_test: ATOM-VT41-047
- id: ATOM-V4-SCM-002
  priority: P0
  phase: v4.1
  requirement: Semantic constraints that JSON Schema cannot express MUST be assigned
    stable rule IDs, implemented by the reference validator, and covered by cross-language
    canonicalization vectors.
  owner: Contract Engineering
  gates:
  - G0
  primary_test: ATOM-VT41-048
- id: ATOM-V4-KRN-003
  priority: P0
  phase: v4.1
  requirement: Native ATOM operation MUST remain complete when Hermes, OpenClaw, AgenC,
    and every compatibility adapter are absent; adapters MUST be replaceable sidecars
    and MUST NOT own authority, ledger, scheduler, mission state, or effect commit.
  owner: Sovereign Kernel
  gates:
  - G0
  - G2
  primary_test: ATOM-VT41-049
- id: ATOM-V4-KRN-004
  priority: P0
  phase: v4.1
  requirement: The default privileged broker MUST expose only typed, versioned, allowlisted
    operations. A generic root shell MUST be absent. Any separate break-glass profile
    MUST require two-person approval, console presence, short expiry, AST allowlisting,
    network deny, immutable transcript, and immediate revocation.
  owner: Sovereign Kernel
  gates:
  - G0
  - G2
  primary_test: ATOM-VT41-050
- id: ATOM-V4-AUT-004
  priority: P0
  phase: v4.1
  requirement: ApprovalGrant MUST bind approver, principal, mission, exact effect
    digest or bounded envelope, purpose, audience, validity, maximum uses, grant generation,
    revocation generation, and evidence freshness; payload drift MUST invalidate approval.
  owner: Authority & Policy
  gates:
  - G0
  - G2
  primary_test: ATOM-VT41-051
- id: ATOM-V4-AUT-005
  priority: P0
  phase: v4.1
  requirement: Every authorization evaluation MUST return a typed PolicyDecision containing
    decision, principal-action-resource-context input digest, matched policies, obligations,
    denial code, policy bundle digest, and evaluation time; obligations MUST execute
    before permit issuance.
  owner: Authority & Policy
  gates:
  - G0
  - G2
  primary_test: ATOM-VT41-052
- id: ATOM-V4-AUT-006
  priority: P0
  phase: v4.1
  requirement: Grant and approval revocation MUST be generation-based, monotonic,
    observable before commit, and effective for all descendants; cached decisions
    MUST NOT survive a newer generation.
  owner: Authority & Policy
  gates:
  - G0
  - G2
  primary_test: ATOM-VT41-053
- id: ATOM-V4-AUT-007
  priority: P0
  phase: v4.2
  requirement: Processes and workloads MUST use non-ambient, auditable identities
    bound to executable digest and instance epoch; production profiles SHOULD support
    SPIFFE-compatible X.509 SVIDs and MUST prevent identity reuse across restored
    stale instances.
  owner: Authority & Policy
  gates:
  - G0
  - G2
  primary_test: ATOM-VT41-054
- id: ATOM-V4-EFX-005
  priority: P0
  phase: v4.1
  requirement: EffectIntent MUST use canonical_request_digest as the sole request
    digest field and MUST require effect_id, mission_id, principal_id, capability_id,
    target, causation_id, grant_ref, permit_ref when issued, resource preconditions,
    idempotency, reconciliation, compensation classification, dependencies, and state.
  owner: Effect Kernel
  gates:
  - G0
  - G2
  primary_test: ATOM-VT41-055
- id: ATOM-V4-EFX-006
  priority: P0
  phase: v4.1
  requirement: Every connector dispatch MUST return or durably synthesize a ConnectorReceipt
    with connector identity/version, attempt, dispatch time, request digest, external
    operation identity, response digest, transport result, observation route, and
    reconciliation cursor.
  owner: Effect Kernel
  gates:
  - G0
  - G2
  primary_test: ATOM-VT41-056
- id: ATOM-V4-EFX-007
  priority: P0
  phase: v4.1
  requirement: ResourcePrecondition witnesses MUST be typed, fresh, target-bound,
    and revalidated at permit issue and consumption; stale or mismatched witnesses
    MUST return a typed conflict and MUST NOT dispatch.
  owner: Effect Kernel
  gates:
  - G0
  - G2
  primary_test: ATOM-VT41-057
- id: ATOM-V4-EFX-008
  priority: P0
  phase: v4.1
  requirement: Retry policy MUST be derived from connector-declared idempotency and
    reconciliation class. UNKNOWN_OUTCOME MUST never enter an automatic retry path
    unless reconciliation proves non-commit or a new authorized effect identity is
    issued.
  owner: Effect Kernel
  gates:
  - G0
  - G2
  primary_test: ATOM-VT41-058
- id: ATOM-V4-EFX-009
  priority: P0
  phase: v4.1
  requirement: Dependency edges MUST block downstream consequential effects while
    predecessors are unresolved, partial, compensating, or unknown; compensation MUST
    itself be a new EffectIntent with independent authority and evidence.
  owner: Effect Kernel
  gates:
  - G0
  - G2
  primary_test: ATOM-VT41-059
- id: ATOM-V4-LED-002
  priority: P0
  phase: v4.1
  requirement: LedgerEvent MUST bind stream_id, sequence, event_id, event_type, schema_version,
    occurred_at, recorded_at, principal, causation, correlation, payload digest, previous
    hash, event hash, instance epoch, and producer identity.
  owner: Ledger & Durability
  gates:
  - G0
  - G3
  primary_test: ATOM-VT41-060
- id: ATOM-V4-LED-003
  priority: P0
  phase: v4.1
  requirement: LedgerCheckpoint MUST seal exact stream heads, database generation,
    restore epoch, manifest digest, signer identity, signature set, and expiry; a
    checkpoint with missing streams or stale epoch MUST fail verification.
  owner: Ledger & Durability
  gates:
  - G0
  - G3
  primary_test: ATOM-VT41-061
- id: ATOM-V4-LED-004
  priority: P0
  phase: v4.1
  requirement: Restore MUST mint a new restore epoch and place the runtime in FENCED_READ_ONLY
    until ledger, checkpoint, external witness, pending effects, schedules, and grants
    are reconciled; old epochs MUST be unable to commit.
  owner: Ledger & Durability
  gates:
  - G0
  - G3
  primary_test: ATOM-VT41-062
- id: ATOM-V4-LED-005
  priority: P1
  phase: v4.2
  requirement: Compaction or archival MUST preserve verifiable checkpoint ancestry,
    legal hold, retention, replay class, and evidence references; authoritative history
    MUST NOT be silently pruned.
  owner: Ledger & Durability
  gates:
  - G0
  - G3
  primary_test: ATOM-VT41-063
- id: ATOM-V4-MSN-004
  priority: P0
  phase: v4.1
  requirement: MissionSpec MUST include a typed acyclic or explicitly iterative mission
    graph with node contracts, dependencies, inputs, outputs, success evidence, retry/replan
    boundaries, authority envelopes, and terminal conditions.
  owner: Mission Runtime
  gates:
  - G0
  - G3
  primary_test: ATOM-VT41-064
- id: ATOM-V4-MSN-005
  priority: P0
  phase: v4.1
  requirement: Replanning MUST preserve the mission contract, completed verified work,
    commitments, consumed budgets, unresolved effects, and evidence lineage; it MUST
    create a new plan revision rather than mutate history.
  owner: Mission Runtime
  gates:
  - G0
  - G3
  primary_test: ATOM-VT41-065
- id: ATOM-V4-MSN-006
  priority: P0
  phase: v4.1
  requirement: Mission state MUST represent BLOCKED and UNSATISFIABLE with typed reason,
    missing condition, responsible actor, next review time, and evidence; the runtime
    MUST NOT fabricate completion.
  owner: Mission Runtime
  gates:
  - G0
  - G3
  primary_test: ATOM-VT41-066
- id: ATOM-V4-MSN-007
  priority: P0
  phase: v4.1
  requirement: Promises, approvals requested, deadlines, and deliverables MUST be
    durable typed commitments linked to mission, owner, due time, fulfillment evidence,
    and cancellation authority.
  owner: Mission Runtime
  gates:
  - G0
  - G3
  primary_test: ATOM-VT41-067
- id: ATOM-V4-COG-002
  priority: P0
  phase: v4.1
  requirement: The Cognitive Architect MUST choose among deterministic workflow, single-agent,
    agent-plus-independent-verifier, bounded multi-agent, simulator-assisted, and
    durable-workflow modes; parallel workers require measurable decomposability or
    specialization benefit and an explicit budget.
  owner: Native Cognition
  gates:
  - G0
  - G2
  primary_test: ATOM-VT41-068
- id: ATOM-V4-COG-003
  priority: P0
  phase: v4.1
  requirement: Every proposed topology MUST declare expected token, monetary, latency,
    worker, energy where measurable, and human-attention cost together with uncertainty
    and a rollback threshold.
  owner: Native Cognition
  gates:
  - G0
  - G2
  primary_test: ATOM-VT41-069
- id: ATOM-V4-COG-004
  priority: P0
  phase: v4.1
  requirement: High-risk decisions MUST use a verifier whose context and failure hypotheses
    are independently constructed unless a stronger programmatic oracle exists; self-evaluation
