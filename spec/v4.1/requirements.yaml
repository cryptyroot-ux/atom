- id: ATOM-V4-PRI-003
  priority: P1
  phase: v4.2
  requirement: Retention and deletion MUST support policy-driven expiry, user export,
    deletion request, tombstone, derived-data invalidation, backup aging, legal hold,
    and a signed completion or exception receipt; ledger integrity MAY preserve non-content
    proofs.
  owner: Privacy Engineering
  gates:
  - G0
  - G7
  primary_test: ATOM-VT41-133
- id: ATOM-V4-PRI-004
  priority: P1
  phase: v4.2
  requirement: Privacy-impacting defaults and telemetry content collection MUST be
    opt-in, versioned, explainable, reversible, and surfaced before activation; consent
    MUST NOT be bundled with unrelated authority.
  owner: Privacy Engineering
  gates:
  - G0
  - G7
  primary_test: ATOM-VT41-134
- id: ATOM-V4-SLO-001
  priority: P0
  phase: v4.1
  requirement: For the reference single-node profile, committed authoritative events
    MUST have zero acknowledged loss under the validated crash model, recovery point
    objective MUST be zero after acknowledged commit, and recovery time objective
    MUST be measured and published with hardware and dataset bounds.
  owner: SRE
  gates:
  - G0
  - G7
  primary_test: ATOM-VT41-135
- id: ATOM-V4-SLO-002
  priority: P1
  phase: v4.2
  requirement: The reference profile MUST publish p50, p95, and p99 admission, policy,
    permit, ledger-append, provider-overhead, and UI latency plus throughput and resource
    curves; thresholds MUST be set per release profile and regressions beyond budget
    block promotion.
  owner: SRE
  gates:
  - G0
  - G7
  primary_test: ATOM-VT41-136
- id: ATOM-V4-SLO-003
  priority: P0
  phase: v4.1
  requirement: Security SLOs MUST include zero unauthorized committed effects in the
    acceptance corpus, zero secret canary disclosures, 100 percent detected ledger
    tamper cases, and bounded revocation-to-enforcement latency declared by deployment
    profile.
  owner: SRE
  gates:
  - G0
  - G7
  primary_test: ATOM-VT41-137
- id: ATOM-V4-SLO-004
  priority: P1
  phase: v4.2
  requirement: Operational SLO reporting MUST include numerator, denominator, exclusions,
    missing telemetry, confidence, and burn rate; an SLO without complete measurement
    metadata MUST be marked unknown rather than pass.
  owner: SRE
  gates:
  - G0
  - G7
  primary_test: ATOM-VT41-138
- id: ATOM-V4-GOV-001
  priority: P0
  phase: v4.1
  requirement: The repository MUST publish an OSI-compatible code license, documentation
    and specification license, contribution terms, third-party notices, security policy,
    code of conduct, and governance charter before public GA.
  owner: Open Governance
  gates:
  - G0
  - G9
  primary_test: ATOM-VT41-139
- id: ATOM-V4-GOV-002
  priority: P0
  phase: v4.1
  requirement: Normative changes MUST use versioned proposals with owner, threat and
    compatibility impact, alternatives, migration, acceptance evidence, reviewer quorum,
    effective version, and supersession links; emergency changes MUST be retrospectively
    ratified within a bounded window.
  owner: Open Governance
  gates:
  - G0
  - G9
  primary_test: ATOM-VT41-140
- id: ATOM-V4-GOV-003
  priority: P1
  phase: v4.2
  requirement: Breaking public schema, API, CLI, event, provider, or compatibility-profile
    changes MUST follow semantic versioning, publish machine-readable deprecation
    metadata, support a declared overlap window, and provide migration tooling and
    fixtures.
  owner: Open Governance
  gates:
  - G0
  - G9
  primary_test: ATOM-VT41-141
- id: ATOM-V4-GOV-004
  priority: P0
  phase: v4.1
  requirement: Security reports MUST have a private intake path, acknowledgement target,
    severity and embargo policy, coordinated disclosure process, patch and revocation
    path, and public advisory with affected digests when safe.
  owner: Open Governance
  gates:
  - G0
  - G9
  primary_test: ATOM-VT41-142
