[package]
name = "atom-identity"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ATOM v4 content-addressed workload/subject identity; grants bind a valid identity (AUT-001)"

[dependencies]
atom-ledger = { path = "../atom-ledger" }
atom-capability = { path = "../atom-capability" }
atom-evidence = { path = "../atom-evidence" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
hex = "0.4.3"

[dev-dependencies]
chrono = { version = "0.4", features = ["serde"] }

[lints.rust]
unsafe_code = "forbid"
