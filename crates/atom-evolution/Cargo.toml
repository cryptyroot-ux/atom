[package]
name = "atom-evolution"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ATOM evolution safety: EVO-001 lifecycle + EVO-002 no-self-promotion (INV-003/012 via atom-capability)"

[dependencies]
atom-capability = { path = "../atom-capability" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
chrono = { version = "0.4", features = ["serde"] }

[lints.rust]
unsafe_code = "forbid"
