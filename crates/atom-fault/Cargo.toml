[package]
name = "atom-fault"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ATOM fault classifier: a pure, deterministic classify(FaultSignal) -> FaultClass and its recovery mapping onto atom_effect::RetryClass (ATOM-FLT-001, ATOM-INV-002)"

[dependencies]
atom-effect = { path = "../atom-effect" }
serde = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
