[package]
name = "atom-approval"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ATOM durable ApprovalGrant lifecycle store: effect-digest / capability-envelope scoping, validity intervals and revocation (AUT-003)"

[dependencies]
atom-capability = { path = "../atom-capability" }
atom-effect = { path = "../atom-effect" }
chrono = { version = "0.4", features = ["serde"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }

[lints.rust]
unsafe_code = "forbid"
