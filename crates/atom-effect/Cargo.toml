[package]
name = "atom-effect"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ATOM effect kernel: durable EffectIntent, one-shot CommitPermit commit boundary and the pure 16-state effect reducer"

[dependencies]
atom-capability = { path = "../atom-capability" }
atom-ledger = { path = "../atom-ledger" }
chrono = { version = "0.4", features = ["serde"] }
serde = { workspace = true, features = ["derive"] }
uuid = { version = "1", features = ["serde", "v4"] }
serde_json = { workspace = true }
sha2 = "0.10"
thiserror = { workspace = true }

[dev-dependencies]
jsonschema = { version = "0.18.3", default-features = false, features = ["draft202012"] }
