[package]
name = "atom-architecture-learner"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ATOM architecture learner: constrained policy over topology actions (ATOM-ARC-001, INV-016)"

[dependencies]
atom-evolution = { path = "../../crates/atom-evolution" }
atom-capability = { path = "../../crates/atom-capability" }
atom-evidence = { path = "../../crates/atom-evidence" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
chrono = { version = "0.4", features = ["serde"] }

[lints.rust]
unsafe_code = "forbid"
